[workspace]
members = [
    "crates/unity-asset-core",
    "crates/unity-asset-yaml",
    "crates/unity-asset-binary",
    "crates/unity-asset-decode",
    "crates/unity-asset-write",
    "crates/unity-asset",
    "crates/unity-asset-search-core",
    "crates/unity-asset-search-local",
    "crates/unity-asset-search-index",
    "crates/unity-asset-search-protocol",
    "apps/unity-asset-cli",
    "apps/unity-asset-search-daemon",
    "apps/unity-asset-search-cli",
]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
license = "MIT"
repository = "https://github.com/Latias94/unity-asset"
homepage = "https://github.com/Latias94/unity-asset"

[workspace.dependencies]
# Workspace crates
unity-asset = { path = "crates/unity-asset", version = "0.4.0", default-features = false }
unity-asset-binary = { path = "crates/unity-asset-binary", version = "0.4.0" }
unity-asset-core = { path = "crates/unity-asset-core", version = "0.4.0" }
unity-asset-decode = { path = "crates/unity-asset-decode", version = "0.4.0" }
unity-asset-search-core = { path = "crates/unity-asset-search-core", version = "0.4.0" }
unity-asset-search-local = { path = "crates/unity-asset-search-local", version = "0.4.0" }
unity-asset-search-index = { path = "crates/unity-asset-search-index", version = "0.4.0" }
unity-asset-search-protocol = { path = "crates/unity-asset-search-protocol", version = "0.4.0" }
unity-asset-write = { path = "crates/unity-asset-write", version = "0.4.0" }
unity-asset-yaml = { path = "crates/unity-asset-yaml", version = "0.4.0" }

# Core dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
yaml-rust2 = { version = "=0.11.0", default-features = false }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
anyhow = "1"
blake3 = "1.8"
sha2 = "0.10"

# Binary parsing
binrw = "0.15"
byteorder = "1.5"
image = "0.25"
flate2 = "1.1"
lz4_flex = "0.12"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Async support
tokio = { version = "1.48", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
tokio-stream = "0.1"
async-stream = "0.3"

# Testing
tempfile = "3.24"

# Utilities
lazy_static = "1.5"
once_cell = "1.21"
regex = "1.12"
regex-automata = "0.4.13"
unicode-normalization = "0.1"
tantivy = "0.26"
fuzzy-matcher = "0.3"
rand = "0.9"
hex = "0.4"
notify = "8"
zip = "0.6"
rustix = "1.1.3"
fs2 = "0.4.3"
subtle = "2.6.1"
same-file = "1.0.6"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# This is now a pure workspace - no package definition
# Individual crates are in their respective directories:
# - crates/unity-asset/     -> Main library crate (published as "unity-asset")
# - apps/unity-asset-cli/   -> CLI tools (published as "unity-asset-cli")
# - crates/unity-asset-core -> Core data structures
# - crates/unity-asset-yaml -> YAML format support
# - crates/unity-asset-binary -> Binary format support
