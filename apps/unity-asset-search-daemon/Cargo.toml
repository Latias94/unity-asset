[package]
name = "unity-asset-search-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Principal-scoped local IPC daemon for Unity project search"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/Latias94/unity-asset"
keywords = ["unity", "search", "daemon", "references"]
categories = ["command-line-utilities", "game-development"]

[dependencies]
anyhow.workspace = true
tokio.workspace = true
thiserror.workspace = true
clap.workspace = true
futures.workspace = true
rand.workspace = true
notify.workspace = true
sha2.workspace = true
unity-asset-core = { workspace = true }
unity-asset-search-index = { workspace = true }
unity-asset-search-local = { workspace = true }
unity-asset-search-protocol = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.dist]
dist = true
