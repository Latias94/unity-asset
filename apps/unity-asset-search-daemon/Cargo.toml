[package]
name = "unity-asset-search-daemon"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
description = "Local HTTP daemon for Unity project search (used by UnityHero)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/Latias94/unity-asset"
keywords = ["unity", "search", "daemon", "references"]
categories = ["command-line-utilities", "game-development"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
tower-http.workspace = true
rand.workspace = true
hex.workspace = true
notify.workspace = true
mime.workspace = true
subtle.workspace = true
fs2.workspace = true
url.workspace = true
unity-asset-core = { path = "../../crates/unity-asset-core", version = "0.3.0" }
unity-asset-search-index = { path = "../../crates/unity-asset-search-index", version = "0.3.0" }
unity-asset-search-protocol = { path = "../../crates/unity-asset-search-protocol", version = "0.3.0" }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.dist]
dist = true
