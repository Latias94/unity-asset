[package]
name = "unity-asset-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Command-line tools for Unity asset parsing and manipulation"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/unity-asset-cli"
keywords = ["unity", "assets", "cli", "parser", "game"]
categories = ["command-line-utilities", "parsing", "game-development"]
exclude = [
    "tests/fixtures/*",
    "tests/samples/*",
    "*.ab",
    "*.unity",
    "*.asset",
    "*.prefab",
    "*.meta",
]

[[bin]]
name = "unity-asset"
path = "src/main.rs"
# The binary's rustdoc output collides with the `unity-asset` library crate.
doc = false

[dependencies]
# Core library
unity-asset = { workspace = true }
unity-asset-binary = { workspace = true }

# CLI dependencies
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
memmap2 = { version = "0.9.9", optional = true }

[features]
default = ["mmap"]
async = ["unity-asset/async"]
decode = ["unity-asset/decode"]
mmap = ["unity-asset/mmap", "unity-asset-binary/mmap", "dep:memmap2"]
full = ["decode", "mmap"]

[package.metadata.docs.rs]
no-default-features = true
all-features = false
features = []
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.dist]
dist = false

[dev-dependencies]
tempfile = { workspace = true }
