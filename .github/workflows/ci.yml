name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  UNITY_ASSET_SOURCE_COMMIT: ${{ github.sha }}

jobs:
  workflow-contracts:
    name: Workflow contracts
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Validate GitHub workflow semantics
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

    - name: Test package and release verifier rejection paths
      run: python -m unittest discover -s scripts/tests -p "test_*.py"

  workspace-package:
    name: Canonical workspace package contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Verify packaged dependency isolation
      run: python scripts/verify_workspace_packages.py --mode full

  msrv:
    name: MSRV / Rust 1.88.0
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust 1.88.0
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.88.0

    - name: Check all library targets against the declared MSRV
      run: |
        rustc +1.88.0 --version | grep -F "rustc 1.88.0 "
        cargo +1.88.0 check --workspace --lib --all-features --locked

  test:
    name: Test / Lint / Fmt
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run exact strict Clippy gate
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Build every workspace target
      run: cargo build --workspace --all-targets

    - name: Run default workspace tests
      run: cargo nextest run --workspace --test-threads 2

    - name: Run exact workspace test gate
      run: cargo nextest run --workspace --all-features --test-threads 2

    - name: Run documented async and decode feature tests
      run: |
        cargo nextest run -p unity-asset --features async --test-threads 2
        cargo nextest run -p unity-asset --features decode --test extraction_decode --test-threads 2
        cargo nextest run -p unity-asset-cli --features decode --test-threads 2

    - name: Verify decode package assets
      run: |
        package_files="$(cargo package -p unity-asset-decode --list)"
        for required in \
          assets/FMOD5SHARP-LICENSE \
          assets/FMOD5SHARP-NOTICE \
          assets/fmod5sharp-vorbis-headers.json \
          tests/fixtures/short_vorbis.fsb; do
          printf '%s\n' "$package_files" | grep -Fqx "$required"
        done

  workspace-publication-platforms:
    name: Platform compilation and contracts / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: workspace-publication-${{ matrix.os }}

    - name: Verify platform package and consumer compatibility
      if: runner.os != 'Linux'
      run: python scripts/verify_workspace_packages.py --mode packages

    - name: Run platform publication, recovery, and extraction unit tests
      if: runner.os != 'Linux'
      run: >-
        cargo nextest run -p unity-asset
        --test-threads 2
        -E 'test(/^workspace::commit::/) | test(/^extraction::artifact::tests::/)'

    - name: Run workspace and security black-box contract tests
      if: runner.os != 'Linux'
      run: >-
        cargo nextest run
        --test-threads 2
        -p unity-asset
        -p unity-asset-cli
        -p unity-asset-search-cli
        -p unity-asset-search-local
        -p unity-asset-search-index
        -p unity-asset-search-daemon
        --test workspace_commit
        --test workspace_recovery
        --test public_workflows
        --test agent_native_workflows
        --test agent_native_workflow
        --test workspace_commands
        --test workspace_json
        --test structured_errors
        --test process_contract

    - name: Run the real daemon JSON-agent harness
      run: python scripts/run_real_daemon_agent.py

    - name: Run generation security unit contracts
      if: runner.os != 'Linux'
      run: >-
        cargo nextest run
        --test-threads 2
        -p unity-asset-search-index
        --lib

    - name: Run daemon lifecycle and watcher security unit contracts
      if: runner.os != 'Linux'
      run: >-
        cargo nextest run
        --test-threads 2
        -p unity-asset-search-daemon
        --bin unity-asset-search-daemon

    - name: Run complete platform-local identity and filesystem security suite
      if: runner.os != 'Linux'
      run: >-
        cargo nextest run
        --test-threads 2
        -p unity-asset-search-local

    - name: Run cross-language search protocol conformance
      run: |
        dotnet build integration/search-protocol/csharp/UnityAsset.SearchProtocol.ExternalConsumer/UnityAsset.SearchProtocol.ExternalConsumer.csproj --configuration Release
        dotnet run --project integration/search-protocol/csharp/UnityAsset.SearchProtocol.Conformance/UnityAsset.SearchProtocol.Conformance.csproj --configuration Release
        cargo nextest run -p unity-asset-search-daemon --test csharp_protocol_http --run-ignored ignored-only --test-threads 1

    - name: Run Windows CLI unit contracts
      if: runner.os == 'Windows'
      run: >-
        cargo nextest run
        --test-threads 2
        -p unity-asset-cli
        --bin unity-asset

  binary-loader-features:
    name: Binary loader / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - mode: buffered
          feature-args: --no-default-features
        - mode: mmap
          feature-args: --no-default-features --features mmap

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: binary-loader-${{ matrix.mode }}

    - name: Run binary loader tests (${{ matrix.mode }})
      run: cargo nextest run -p unity-asset-binary ${{ matrix.feature-args }} --test-threads 2

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check documentation
      run: cargo doc --workspace --all-features --no-deps

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: rustsec/audit-check@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
