name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  unix-script-contracts:
    name: Unix script contracts
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install zsh
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --yes zsh

    - name: Validate zsh syntax
      run: |
        for script in scripts/*.zsh; do
          zsh -n "$script"
        done

  test:
    name: Test / Lint / Fmt
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Clippy (workspace defaults)
      run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::collapsible_if

    - name: Clippy (async)
      run: |
        cargo clippy -p unity-asset-core --all-targets --features async -- -D warnings -A clippy::collapsible_if
        cargo clippy -p unity-asset-yaml --all-targets --features async -- -D warnings -A clippy::collapsible_if
        cargo clippy -p unity-asset --all-targets --features async -- -D warnings -A clippy::collapsible_if
        cargo clippy -p unity-asset-cli --all-targets --features async -- -D warnings -A clippy::collapsible_if

    - name: Clippy (decode/export)
      run: |
        cargo clippy -p unity-asset-decode --all-targets --features full -- -D warnings -A clippy::collapsible_if
        cargo clippy -p unity-asset-cli --all-targets --features decode -- -D warnings -A clippy::collapsible_if

    - name: Test CLI tools
      run: |
        cargo build --workspace
        ./target/debug/unity-asset --help
        cargo build -p unity-asset-cli --features async
        ./target/debug/unity-asset --help
        cargo build -p unity-asset-cli --features decode

    - name: Build examples
      run: cargo build --workspace --examples --all-features

    - name: Run tests (workspace defaults)
      run: cargo nextest run --workspace --test-threads 2

    - name: Run tests (async)
      run: |
        cargo nextest run -p unity-asset --features async --test-threads 2
        cargo nextest run -p unity-asset-cli --features async --test-threads 2 --no-tests=pass

    - name: Run tests (decode/export)
      run: |
        cargo nextest run -p unity-asset-decode --features full --test-threads 2
        cargo nextest run -p unity-asset --features decode --test extraction_decode --test-threads 2
        cargo nextest run -p unity-asset-cli --features decode --test-threads 2

    - name: Verify decode package assets
      run: |
        package_files="$(cargo package -p unity-asset-decode --list)"
        for required in \
          assets/FMOD5SHARP-LICENSE \
          assets/FMOD5SHARP-NOTICE \
          assets/fmod5sharp-vorbis-headers.json \
          tests/fixtures/short_vorbis.fsb; do
          printf '%s\n' "$package_files" | grep -Fqx "$required"
        done

  workspace-publication-platforms:
    name: Filesystem publication and security / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: workspace-publication-${{ matrix.os }}

    - name: Run platform publication, recovery, and extraction unit tests
      run: >-
        cargo nextest run -p unity-asset
        --test-threads 2
        -E 'test(/^workspace::commit::/) | test(/^extraction::artifact::tests::/)'

    - name: Run workspace and security black-box contract tests
      run: >-
        cargo nextest run
        --test-threads 2
        -p unity-asset
        -p unity-asset-cli
        -p unity-asset-search-cli
        -p unity-asset-search-index
        -p unity-asset-search-daemon
        --test workspace_commit
        --test workspace_recovery
        --test public_workflows
        --test agent_native_workflows
        --test agent_native_workflow
        --test workspace_commands
        --test workspace_json
        --test structured_errors
        --test reference_generation
        --test http_contract
        --test reindex_coordinator
        --test security_contract

    - name: Run generation security unit contracts
      run: >-
        cargo nextest run
        --test-threads 2
        -p unity-asset-search-index
        --lib

    - name: Run Windows CLI and daemon unit contracts
      if: runner.os == 'Windows'
      run: >-
        cargo nextest run
        --test-threads 2
        -p unity-asset-cli
        -p unity-asset-search-daemon
        --bin unity-asset
        --lib

  binary-loader-features:
    name: Binary loader / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - mode: buffered
          feature-args: --no-default-features
        - mode: mmap
          feature-args: --no-default-features --features mmap

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: binary-loader-${{ matrix.mode }}

    - name: Run binary loader tests (${{ matrix.mode }})
      run: cargo nextest run -p unity-asset-binary ${{ matrix.feature-args }} --test-threads 2

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check documentation
      run: cargo doc --all --all-features --no-deps

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: rustsec/audit-check@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
