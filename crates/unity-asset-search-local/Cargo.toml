[package]
name = "unity-asset-search-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Local project identity and endpoint discovery for unity-asset search"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/unity-asset-search-local"
keywords = ["unity", "search", "ipc"]
categories = ["command-line-utilities", "game-development"]

[dependencies]
fs2.workspace = true
hex.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6.0"
thiserror.workspace = true
tokio.workspace = true
unity-asset-search-protocol = { workspace = true }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { workspace = true, features = ["fs", "net", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
