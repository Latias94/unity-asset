[package]
name = "unity-asset-binary"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
description = "Unity binary file format parser (AssetBundle, SerializedFile)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/unity-asset-binary"
keywords = ["unity", "binary", "assetbundle", "serialized", "parser"]
categories = ["parser-implementations", "game-development"]
exclude = [
    "tests/samples/*",
    "tests/fixtures/*",
    "*.ab",
    "*.unity",
    "*.asset",
    "*.prefab",
    "*.meta",
]

[dependencies]
# Core dependencies
unity-asset-core = { path = "../unity-asset-core", version = "0.3.0" }
serde = { workspace = true }
thiserror = { workspace = true }
indexmap = { workspace = true }
serde_json = { workspace = true }

# Binary parsing
binrw = { workspace = true }
byteorder = { workspace = true }
regex = { workspace = true }

# Compression support
flate2 = { workspace = true }
lz4_flex = { workspace = true }
# The decoder scratch budget mirrors lzma-rs 0.3.0's allocation model.
lzma-rs = "=0.3.0"
brotli = { version = "8.0", default-features = false, features = ["std"] }
memmap2 = { version = "0.9", optional = true }

# Performance and utilities
once_cell = { workspace = true }
num_cpus = "1.16"

[features]
default = []
mmap = ["dep:memmap2"]

[dev-dependencies]
hex = "0.4"
tempfile = { workspace = true }

[package.metadata.docs.rs]
no-default-features = true
all-features = false
features = []
rustdoc-args = ["--cfg", "docsrs"]
