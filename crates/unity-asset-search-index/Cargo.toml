[package]
name = "unity-asset-search-index"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
description = "Local search index for Unity projects (Search Everything / Find References)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/unity-asset-search-index"
keywords = ["unity", "search", "index", "references"]
categories = ["command-line-utilities", "game-development"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
hex.workspace = true
tantivy.workspace = true
ignore.workspace = true
fs2.workspace = true
same-file.workspace = true
unity-asset-core = { path = "../unity-asset-core", version = "0.3.0" }
unity-asset = { path = "../unity-asset", version = "0.3.0", default-features = false }
unity-asset-search-core = { path = "../unity-asset-search-core", version = "0.3.0" }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
tempfile.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
