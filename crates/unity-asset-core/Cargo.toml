[package]
name = "unity-asset-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Core data structures and traits for Unity asset parsing"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/unity-asset-core"
keywords = ["unity", "assets", "core", "game"]
categories = ["parsing", "game-development"]
exclude = [
    "tests/fixtures/*",
    "tests/samples/*",
    "*.ab",
    "*.unity",
    "*.asset",
    "*.prefab",
    "*.meta",
]

[package.metadata.docs.rs]
no-default-features = true
all-features = false
features = []
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde = { workspace = true }
serde_bytes = { workspace = true }
indexmap = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true, features = ["unbounded_depth"] }

# Async support (optional)
async-trait = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[features]
default = []
async = ["async-trait", "futures"]
