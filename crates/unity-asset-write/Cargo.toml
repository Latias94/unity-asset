[package]
name = "unity-asset-write"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Unity asset edit/write support (SerializedFile/Bundle/WebFile), targeting UnityPy parity"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/unity-asset-write"
readme = "../../README.md"
keywords = ["unity", "assets", "writer", "editor", "bundle"]
categories = ["parsing", "game-development"]

[dependencies]
unity-asset-core = { workspace = true }
unity-asset-binary = { workspace = true }
unity-asset-yaml = { workspace = true }
indexmap = { workspace = true }
lz4_flex = { workspace = true }
lzma-rs = "0.3"
brotli = { version = "8.0", default-features = false, features = ["std"] }
flate2 = { workspace = true }
libc = "0.2"
thiserror = { workspace = true }
unicode-normalization = { workspace = true }

[build-dependencies]
cc = "1"

[dev-dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[package.metadata.docs.rs]
no-default-features = true
all-features = false
rustdoc-args = ["--cfg", "docsrs"]
