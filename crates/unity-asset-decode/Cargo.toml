[package]
name = "unity-asset-decode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Decode/export helpers for Unity assets (Texture/Audio/Sprite) built on unity-asset-binary"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/unity-asset-decode"
keywords = ["unity", "assets", "decode", "export", "parser"]
categories = ["parsing", "game-development"]
include = ["src/**", "assets/**", "tests/**", "Cargo.toml"]

[dependencies]
unity-asset-binary = { workspace = true }
unity-asset-core = { workspace = true }
serde = { workspace = true }
image = { workspace = true, optional = true }
crc32fast = { version = "1.5", optional = true }
texture2ddecoder = { version = "0.1", optional = true }
indexmap = { workspace = true }
base64 = { version = "0.22", optional = true }
ogg = { version = "0.9", optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }

[features]
default = []

texture = ["dep:crc32fast", "dep:image"]
texture-advanced = ["texture", "dep:texture2ddecoder"]
audio = [
    "dep:base64",
    "dep:ogg",
    "dep:serde_json",
]
sprite = ["texture"]

full = ["texture", "texture-advanced", "audio", "sprite"]

[dev-dependencies]
tempfile = { workspace = true }
hex = "0.4"
serde_json = { workspace = true }

[package.metadata.docs.rs]
no-default-features = true
all-features = false
features = ["full"]
rustdoc-args = ["--cfg", "docsrs"]
